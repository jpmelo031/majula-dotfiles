# Majula lock screen (same look as the SDDM login).

$text   = rgb(DDD6C6)
$muted  = rgb(A39B8C)
$accent = rgb(D1A35C)
$ember  = rgb(E0783E)
$danger = rgb(C06452)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/wallpaper.png
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
}

# Time
label {
    monitor =
    text = <span font_features="lnum">$TIME</span>
    color = $text
    font_size = 138
    font_family = Cormorant Garamond Light
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    color = $muted
    font_size = 18
    font_family = Inter
    position = 0, -5
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = <span text_transform="uppercase" letter_spacing="2048"><b>$USER</b></span>
    color = $accent
    font_size = 13
    font_family = Inter
    position = 0, -87
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    rounding = 10

    outer_color = $ember $accent 45deg
    inner_color = rgb(1E2428)
    font_color = $text
    check_color = $accent
    fail_color = $danger
    capslock_color = $ember

    font_family = Inter
    placeholder_text = <span foreground="##A39B8C">Password</span>
    fail_text = <span foreground="##C06452">Wrong password</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35

    position = 0, -131
    halign = center
    valign = center
}
